# SPA server for the Vite build.
#
# This file runs inside nginxinc/nginx-unprivileged, so it listens on 8080 as a
# non-root user (uid 101) and cannot bind privileged ports.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router deep links (/pagos/12, /dashboard, ...) must be
    # served by index.html instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets, safe to cache forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entry point.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
}
