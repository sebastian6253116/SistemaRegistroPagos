# Production stack for Dokploy (Docker Compose) - SINGLE service.
#
# - One image built from the ROOT Dockerfile: the Express API also serves the
#   built React SPA from the same origin (no nginx, no separate web container,
#   no CORS round-trip).
# - The database is EXTERNAL (MariaDB/MySQL): there is no `db` service here.
#   DATABASE_URL must point at the external server.
# - No secret is committed: every value below is interpolated from the
#   environment that Dokploy / the operator supplies.
# - Dokploy routes ONE public domain to the container port (configure it in the
#   Dokploy UI). The host port is intentionally NOT published, so the app is
#   only reachable through the Dokploy proxy.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "${PORT:-4000}"
      # Directory of the baked SPA build; must match the Dockerfile.
      WEB_DIST_DIR: "/app/web/dist"
      DATABASE_URL: "${DATABASE_URL}"
      # Same origin now, so this is no longer load-bearing for the SPA; it still
      # guards any browser client that talks to the API cross-origin.
      CORS_ORIGIN: "${CORS_ORIGIN}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-7d}"
      MAX_LOGIN_ATTEMPTS: "${MAX_LOGIN_ATTEMPTS:-5}"
      LOGIN_LOCK_MINUTES: "${LOGIN_LOCK_MINUTES:-15}"
      BUSINESS_TIMEZONE: "${BUSINESS_TIMEZONE:-America/Caracas}"
      # Must stay `uploads` so it matches the volume mount below.
      UPLOAD_DIR: "${UPLOAD_DIR:-uploads}"
    volumes:
      # Uploaded receipts must survive redeploys.
      - app_uploads:/app/uploads
    expose:
      - "${PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-4000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  # Explicit name preserved from the previous two-service stack so existing
  # uploaded receipts are not orphaned.
  app_uploads:
    name: gestion_cobros_api_uploads
