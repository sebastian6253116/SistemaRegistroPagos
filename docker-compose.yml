# Production stack for Dokploy (Docker Compose).
#
# - The database is EXTERNAL (MariaDB/MySQL): there is no `db` service here.
#   DATABASE_URL must point at the external server.
# - No secret is committed: every value below is interpolated from the
#   environment that Dokploy / the operator supplies.
# - Dokploy routes the public domains to the container ports (configure them in
#   the Dokploy UI). Host ports are intentionally NOT published, so the API is
#   only reachable through the Dokploy proxy.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "${API_PORT:-4000}"
      DATABASE_URL: "${DATABASE_URL}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-7d}"
      MAX_LOGIN_ATTEMPTS: "${MAX_LOGIN_ATTEMPTS:-5}"
      LOGIN_LOCK_MINUTES: "${LOGIN_LOCK_MINUTES:-15}"
      BUSINESS_TIMEZONE: "${BUSINESS_TIMEZONE:-America/Caracas}"
      # Must stay `uploads` so it matches the volume mount below.
      UPLOAD_DIR: "${UPLOAD_DIR:-uploads}"
    volumes:
      # Uploaded receipts must survive redeploys.
      - api_uploads:/app/uploads
    expose:
      - "${API_PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-4000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Inlined by Vite at BUILD time; MUST be the API public URL (with /api).
        VITE_API_URL: "${VITE_API_URL}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Explicit name so data survives Dokploy project renames/redeploys.
  api_uploads:
    name: gestion_cobros_api_uploads
