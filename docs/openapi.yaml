  /tasas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tasas]
      operationId: getTasa
      summary: Obtener tasa por id
      description: 'Requiere permiso: tasas.ver.'
      responses:
        '200':
          description: Tasa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tasa'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tasas]
      operationId: updateTasa
      summary: Actualizar tasa
      description: 'Requiere permiso: tasas.gestionar.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fecha: { type: string, format: date, example: '2026-09-20' }
                valor: { type: string, pattern: '^\d+(?:\.\d{1,6})?$', example: '37.100000' }
                fuente: { type: string, maxLength: 120, nullable: true, example: BCV }
            example:
              valor: '37.100000'
              fuente: BCV
      responses:
        '200':
          description: Tasa actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tasa'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasas]
      operationId: deleteTasa
      summary: Eliminar tasa
      description: 'Requiere permiso: tasas.gestionar.'
      responses:
        '204':
          description: Tasa eliminada (sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasas-bcv/actual:
    get:
      tags: [Tasa BCV]
