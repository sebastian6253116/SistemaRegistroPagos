openapi: 3.0.3
info:
  title: Sistema de Gestion de Cobros - API
  version: 1.0.0
  description: |
    API REST del Sistema de Gestion de Cobros (recaudacion, conciliacion bancaria,
    importacion de extractos, gastos, reportes y auditoria).

    Base path: `/api`. Autenticacion mediante JWT de acceso enviado como
    `Authorization: Bearer <accessToken>`.

    Formato de listas: `{ "data": [...], "meta": { page, pageSize, total, totalPages } }`.
    Formato de errores: `{ "error": { "code", "message", "details?" } }`.

    Los montos y tasas viajan como STRING en JSON (p. ej. `"3600.00"`) para
    preservar la precision de `DECIMAL(18,2)` / `DECIMAL(18,6)`.
servers:
  - url: 'http://localhost:{port}/api'
    description: Servidor local de desarrollo
    variables:
      port:
        default: '4000'
        description: Puerto del API (variable de entorno PORT)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Autenticacion, sesion y gestion de contrasena
  - name: Usuarios
    description: Gestion de usuarios del sistema
  - name: Roles
    description: Roles y catalogo de permisos
  - name: Cobradores
    description: Catalogo de cobradores
  - name: Bancos
    description: Catalogo de bancos
  - name: Cuentas
    description: Cuentas recaudadoras
  - name: Tipos de pago
    description: Catalogo configurable de formas de pago y tipo predeterminado
  - name: Tasas
    description: Tasas de referencia (una por dia)
  - name: Tasa BCV
    description: Historico informativo de la tasa BCV y su job de sincronizacion
  - name: Parametros
    description: Parametros de configuracion (tolerancias y umbrales)
  - name: Catalogos
    description: Catalogos ligeros de solo lectura para formularios
  - name: Pagos
    description: Reporte, consulta y edicion de pagos reportados
  - name: Conciliacion
    description: Conciliacion bancaria (coincidencias, validacion, rechazo, duplicados)
  - name: Movimientos
    description: Movimientos bancarios importados
  - name: Importacion
    description: Importacion de extractos bancarios y lotes
  - name: Gastos
    description: Gestion de gastos y comprobantes de soporte
  - name: Archivos
    description: Descarga autenticada y autorizada de archivos de soporte almacenados
  - name: Notificaciones
    description: Notificaciones internas del usuario autenticado
  - name: Dashboard
    description: Agregados y series para el tablero
  - name: Reportes
    description: Reportes analiticos y exportacion a Excel/PDF
  - name: Auditoria
    description: Bitacora de auditoria (solo lectura)
  - name: Health
    description: Estado del servicio
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Estado del servicio
      description: Endpoint publico de healthcheck. No requiere autenticacion.
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  env:
                    type: string
                    enum: [development, test, production]
                    example: development
              example:
                status: ok
                env: development

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Iniciar sesion
      description: |
        Autentica con usuario o email + contrasena. Aplica bloqueo por intentos
        fallidos (5 por defecto, 15 minutos) y rate limit (20 intentos / 15 min).
        No requiere permisos. Endpoint publico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password]
              properties:
                usuario:
                  type: string
                  description: Nombre de usuario o email
                  maxLength: 150
                  example: admin
                password:
                  type: string
                  maxLength: 200
                  example: Admin12345
            example:
              usuario: admin
              password: Admin12345
      responses:
        '200':
          description: Sesion iniciada. Devuelve el usuario y el par de tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
              example:
                user:
                  id: 1
                  usuario: admin
                  nombreCompleto: Administrador General
                  rolId: 1
                  rol: Administrador
                  permisos: [usuarios.ver, pagos.validar, reportes.ver]
                  cobradorId: null
                  cobrador: null
                tokens:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn: 15m
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Refrescar tokens
      description: |
        Rota el refresh token (revoca el anterior) y emite un nuevo par.
        Endpoint publico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Nuevo par de tokens emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Cerrar sesion
      description: |
        Revoca el refresh token indicado. No requiere access token (endpoint
        publico). Responde 204 sin cuerpo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: Sesion cerrada (sin contenido)
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: authForgotPassword
      summary: Solicitar recuperacion de contrasena
      description: |
        Inicia el flujo de recuperacion. Rate limit 10 solicitudes / 30 min.
        En entornos no productivos devuelve `token` para pruebas; en produccion
        se enviaria por correo. Endpoint publico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@empresa.com
            example:
              email: admin@empresa.com
      responses:
        '200':
          description: Solicitud procesada (respuesta generica para no revelar si la cuenta existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                    description: Solo presente cuando NODE_ENV != production
              example:
                message: Si el correo existe, se envio un enlace de recuperacion.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: authResetPassword
      summary: Restablecer contrasena con token
      description: |
        Completa la recuperacion con un token valido, no usado y no expirado.
        Revoca las sesiones activas del usuario. Rate limit 10 / 30 min.
        Endpoint publico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  example: 5f2c9b7a1d3e4f60718293a4b5c6d7e8
                password:
                  type: string
                  minLength: 8
                  maxLength: 200
                  example: NuevaClave123
            example:
              token: 5f2c9b7a1d3e4f60718293a4b5c6d7e8
              password: NuevaClave123
      responses:
        '200':
          description: Contrasena restablecida
          content:
            application/json:
              example:
                message: Contrasena restablecida correctamente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Usuario autenticado actual
      description: 'Requiere autenticacion (Bearer). Devuelve el usuario con su rol y permisos efectivos.'
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
              example:
                id: 1
                usuario: admin
                nombreCompleto: Administrador General
                rolId: 1
                rol: Administrador
                permisos: [usuarios.ver, pagos.validar, reportes.ver]
                cobradorId: null
                cobrador: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: authChangePassword
      summary: Cambiar contrasena del usuario autenticado
      description: 'Requiere autenticacion (Bearer). Valida la contrasena actual y aplica la nueva.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNueva]
              properties:
                passwordActual:
                  type: string
                  example: Admin12345
                passwordNueva:
                  type: string
                  minLength: 8
                  maxLength: 200
                  example: NuevaClave123
            example:
              passwordActual: Admin12345
              passwordNueva: NuevaClave123
      responses:
        '200':
          description: Contrasena actualizada
          content:
            application/json:
              example:
                message: Contrasena actualizada correctamente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listUsuarios
      summary: Listar usuarios
      description: 'Requiere permiso: usuarios.ver.'
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - name: search
          in: query
          required: false
          description: Busca por nombre completo, usuario o email
          schema: { type: string, maxLength: 150, example: admin }
        - name: rolId
          in: query
          required: false
          description: Filtra por rol
          schema: { type: integer, example: 1 }
        - name: activo
          in: query
          required: false
          description: Filtra por estado activo
          schema: { type: boolean, example: true }
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPage'
              example:
                data:
                  - id: 1
                    nombreCompleto: Administrador General
                    usuario: admin
                    email: admin@empresa.com
                    rolId: 1
                    activo: true
                    intentosFallidos: 0
                    bloqueadoHasta: null
                    ultimoAcceso: '2026-09-19T12:00:00.000Z'
                    createdAt: '2026-01-01T00:00:00.000Z'
                    updatedAt: '2026-09-19T12:00:00.000Z'
                    rol: { id: 1, nombre: Administrador }
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Usuarios]
      operationId: createUsuario
      summary: Crear usuario
      description: 'Requiere permiso: usuarios.crear.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombreCompleto, usuario, email, password, rolId]
              properties:
                nombreCompleto: { type: string, maxLength: 150, example: Juan Perez }
                usuario: { type: string, maxLength: 60, example: jperez }
                email: { type: string, format: email, maxLength: 150, example: jperez@empresa.com }
                password: { type: string, minLength: 8, maxLength: 200, example: Clave12345 }
                rolId: { type: integer, example: 2 }
                activo: { type: boolean, default: true, example: true }
            example:
              nombreCompleto: Juan Perez
              usuario: jperez
              email: jperez@empresa.com
              password: Clave12345
              rolId: 2
              activo: true
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Usuarios]
      operationId: getUsuario
      summary: Obtener usuario por id
      description: 'Requiere permiso: usuarios.ver.'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Usuarios]
      operationId: updateUsuario
      summary: Actualizar usuario
      description: 'Requiere permiso: usuarios.editar. Todos los campos son opcionales.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombreCompleto: { type: string, maxLength: 150, example: Juan Perez Gomez }
                usuario: { type: string, maxLength: 60, example: jperez }
                email: { type: string, format: email, maxLength: 150, example: jperez@empresa.com }
                password: { type: string, minLength: 8, maxLength: 200, example: Clave12345 }
                rolId: { type: integer, example: 2 }
                activo: { type: boolean, example: true }
            example:
              nombreCompleto: Juan Perez Gomez
              rolId: 2
              activo: true
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Usuarios]
      operationId: deleteUsuario
      summary: Desactivar usuario (soft delete)
      description: 'Requiere permiso: usuarios.eliminar. Desactiva el usuario, no lo borra.'
      responses:
        '204':
          description: Usuario desactivado (sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/{id}/definitivo:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [Usuarios]
      operationId: deleteUsuarioDefinitivo
      summary: Eliminar usuario definitivamente (hard delete)
      description: 'Requiere permiso: usuarios.eliminar_definitivo. Elimina el usuario de forma permanente (y su cobrador vinculado si existe). Rechaza con 409 si tiene registros dependientes (gastos, conciliaciones, importaciones, pagos validados o pagos del cobrador vinculado); tambien rechaza con 400 el auto-borrado. El registro de auditoria se conserva: sus filas sobreviven con el actor en NULL.'
      responses:
        '204':
          description: Usuario eliminado definitivamente (sin contenido)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: Listar roles
      description: 'Requiere permiso: roles.ver.'
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 80, example: admin }
      responses:
        '200':
          description: Lista paginada de roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolPage'
              example:
                data:
                  - id: 1
                    nombre: Administrador
                    descripcion: Acceso total
                    createdAt: '2026-01-01T00:00:00.000Z'
                    updatedAt: '2026-01-01T00:00:00.000Z'
                    permisos: [usuarios.ver, pagos.validar]
                    usuarioCount: 1
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Roles]
      operationId: createRol
      summary: Crear rol
      description: 'Requiere permiso: roles.gestionar.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, maxLength: 80, example: Supervisora }
                descripcion: { type: string, maxLength: 255, nullable: true, example: Supervisa cobradores }
                permisos:
                  type: array
                  items: { type: string }
                  default: []
                  example: [pagos.ver_todos, pagos.validar]
            example:
              nombre: Supervisora
              descripcion: Supervisa cobradores
              permisos: [pagos.ver_todos, pagos.validar]
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles/permisos:
    get:
      tags: [Roles]
      operationId: listPermisosCatalog
      summary: Catalogo de permisos agrupado por modulo
      description: 'Requiere permiso: roles.ver. Permisos agrupados por prefijo (antes del punto).'
      responses:
        '200':
          description: Catalogo de permisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        modulo: { type: string, example: pagos }
                        permisos:
                          type: array
                          items:
                            type: object
                            properties:
                              clave: { type: string, example: pagos.validar }
                              descripcion: { type: string, nullable: true, example: Validar pagos reportados }
              example:
                data:
                  - modulo: pagos
                    permisos:
                      - { clave: pagos.validar, descripcion: Validar pagos reportados }
                      - { clave: pagos.rechazar, descripcion: Rechazar pagos }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Roles]
      operationId: getRol
      summary: Obtener rol por id
      description: 'Requiere permiso: roles.ver.'
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Roles]
      operationId: updateRol
      summary: Actualizar rol
      description: 'Requiere permiso: roles.gestionar.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, maxLength: 80, example: Supervisora General }
                descripcion: { type: string, maxLength: 255, nullable: true, example: Supervisa todas las zonas }
                permisos:
                  type: array
                  items: { type: string }
                  example: [pagos.ver_todos, pagos.validar, reportes.ver]
            example:
              nombre: Supervisora General
              permisos: [pagos.ver_todos, pagos.validar, reportes.ver]
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Roles]
      operationId: deleteRol
      summary: Eliminar rol
      description: 'Requiere permiso: roles.gestionar. Falla con 409 si tiene usuarios asignados.'
      responses:
        '204':
          description: Rol eliminado (sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /cobradores:
    get:
      tags: [Cobradores]
      operationId: listCobradores
      summary: Listar cobradores
      description: 'Requiere permiso: cobradores.ver.'
      parameters:
