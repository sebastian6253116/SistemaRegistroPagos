          $ref: '#/components/responses/InternalError'
    post:
      tags: [Gastos]
      operationId: crearGasto
      summary: Crear gasto
      description: 'Requiere permiso: gastos.crear. La tasa se deriva de montoBs / montoUsd.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, montoBs, montoUsd, descripcion, categoria, autorizadoPor]
              properties:
                fecha: { type: string, description: 'Fecha (ISO o YYYY-MM-DD)', example: '2026-09-15' }
                montoBs: { type: string, pattern: '^\d+(\.\d{1,2})?$', example: '1800.00' }
                montoUsd: { type: string, pattern: '^\d+(\.\d{1,2})?$', example: '10.00' }
                movimientoBancoId: { type: integer, example: 25 }
                referencia: { type: string, maxLength: 60, example: 'GASTO-001' }
                descripcion: { type: string, maxLength: 500, example: Transporte a zona norte }
                categoria: { type: string, maxLength: 100, example: Transporte }
                autorizadoPor: { type: string, maxLength: 180, example: Gerencia }
            example:
              fecha: '2026-09-15'
              montoBs: '1800.00'
              montoUsd: '10.00'
              descripcion: Transporte a zona norte
              categoria: Transporte
              autorizadoPor: Gerencia
              referencia: 'GASTO-001'
      responses:
        '201':
          description: Gasto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gasto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
