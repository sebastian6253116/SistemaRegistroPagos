  /reportes/cobros:
    get:
      tags: [Reportes]
      operationId: reporteCobros
      summary: Reporte de cobros
      description: >-
        Requiere permiso: reportes.ver. Cada fila expone el veredicto de
        antiguedad PERSISTIDO al validar: `tipoCobroDerivado` (nuevo/viejo),
        `fuenteDerivacion` (`movimiento` cuando el cobro se valido contra un
        movimiento bancario) y `antiguedadDias`, la brecha firmada en dias
        completos entre la `fechaPago` reportada y la `fechaEjecucion` del
        movimiento vinculado (0 = mismo dia; positivo = movimiento anterior =
        pago viejo). El umbral `cobro.umbral_antiguedad_dias` se lee como
        "N dias o mas = viejo" (`>=`). Cada fila de `cobros` agrega ademas
        `fechaMovimiento` y `esViejo`. Sin movimiento vinculado la fila emite
        `antiguedadDias: null`, `esViejo: false` y el veredicto puede ser `null`.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
        - $ref: '#/components/parameters/CobradorIdQuery'
        - $ref: '#/components/parameters/BancoIdQuery'
        - $ref: '#/components/parameters/EstadoQuery'
      responses:
        '200':
          description: Reporte paginado de cobros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

