        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet` (Excel)
        o `application/pdf` segun el parametro `formato`. Documentado como
        `application/octet-stream` por ser respuesta binaria.
      parameters:
        - name: tipo
          in: path
          required: true
          description: Tipo de reporte a exportar
          schema:
            type: string
            enum: [cobros, por-cobrador, nuevo-viejo, tasas, pendientes, movimientos-no-conciliados, pagos-sin-respaldo, flujo-caja, gastos]
            example: cobros
        - name: formato
          in: query
          required: false
          description: Formato de exportacion (por defecto excel)
          schema: { type: string, enum: [excel, pdf], default: excel, example: excel }
        - name: fechaDesde
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-09-01' }
        - name: fechaHasta
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-09-30' }
        - name: cobradorId
          in: query
          required: false
          schema: { type: integer, example: 1 }
        - name: bancoId
          in: query
          required: false
          schema: { type: integer, example: 1 }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [pendiente, validado, rechazado, duplicado], example: validado }
      responses:
        '200':
          description: Archivo Excel (.xlsx) o PDF
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="cobros_2026-09-01_2026-09-30.xlsx"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
