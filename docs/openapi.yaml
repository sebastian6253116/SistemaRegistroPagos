        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tasas]
      operationId: createTasa
      summary: Crear o reemplazar la tasa de un dia
      description: |
        Requiere permiso: tasas.gestionar. Es un upsert por `fecha` (una tasa por dia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, valor]
              properties:
                fecha: { type: string, format: date, example: '2026-09-19' }
                valor:
                  type: string
                  description: Decimal con hasta 6 decimales (se envia como string)
                  pattern: '^\d+(?:\.\d{1,6})?$'
                  example: '36.500000'
                fuente: { type: string, maxLength: 120, nullable: true, example: BCV }
            example:
              fecha: '2026-09-19'
              valor: '36.500000'
              fuente: BCV
      responses:
        '201':
          description: Tasa creada o reemplazada
          content:
            application/json:
              schema:
