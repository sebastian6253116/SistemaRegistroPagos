        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT de acceso (accessToken) enviado como Authorization: Bearer <token>.'

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: Numero de pagina (>= 1). Por defecto 1.
      schema: { type: integer, minimum: 1, example: 1 }
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      description: Tamano de pagina (1..200). Por defecto 20.
      schema: { type: integer, minimum: 1, maximum: 200, example: 20 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
    FechaDesde:
      name: fechaDesde
      in: query
      required: false
      description: Fecha inicial del rango (YYYY-MM-DD)
      schema: { type: string, format: date, example: '2026-09-01' }
    FechaHasta:
      name: fechaHasta
      in: query
      required: false
      description: Fecha final del rango (YYYY-MM-DD)
      schema: { type: string, format: date, example: '2026-09-30' }
    CobradorIdQuery:
      name: cobradorId
      in: query
      required: false
      description: Filtra por cobrador
      schema: { type: integer, example: 1 }
    BancoIdQuery:
      name: bancoId
      in: query
      required: false
      description: Filtra por banco
      schema: { type: integer, example: 1 }
    EstadoQuery:
      name: estado
      in: query
      required: false
      description: Filtra por estado del pago
      schema: { type: string, enum: [pendiente, validado, rechazado, duplicado], example: validado }

  responses:
    BadRequest:
      description: Solicitud invalida (validacion Zod o regla de negocio)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: Datos invalidos
              details: {}
    Unauthorized:
      description: No autenticado (token ausente, invalido o expirado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unauthorized, message: Token de acceso requerido }
    Forbidden:
      description: Permisos insuficientes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: forbidden, message: 'Permisos insuficientes: pagos.validar' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_found, message: Recurso no encontrado }
    Conflict:
      description: Conflicto (duplicado o estado incompatible)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: conflict, message: El registro ya existe (valor duplicado) }
    TooManyRequests:
      description: Demasiadas solicitudes (rate limit o cuenta bloqueada)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: too_many_requests, message: Demasiados intentos. Intente mas tarde. }
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal_error, message: Error interno del servidor }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: bad_request
            message:
              type: string
              example: Datos invalidos
            details:
              type: object
              description: Detalle adicional opcional (por ejemplo, errores de validacion)
              nullable: true

    Meta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 1 }
        totalPages: { type: integer, example: 1 }

    Paginated:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'

    AuthUser:
      type: object
      properties:
        id: { type: integer, example: 1 }
        usuario: { type: string, example: admin }
        nombreCompleto: { type: string, example: Administrador General }
        rolId: { type: integer, example: 1 }
        rol: { type: string, example: Administrador }
        permisos:
          type: array
          items: { type: string }
          example: [usuarios.ver, pagos.validar]
        cobradorId: { type: integer, nullable: true, example: null }
        cobrador:
          type: object
          nullable: true
          description: >
            Cobrador propio del usuario. El formulario de pago lo muestra en solo lectura
            para quien NO tiene `pagos.ver_todos`, porque ese usuario solo puede reportar
            a su propio nombre. `null` cuando el usuario no tiene cobrador vinculado.
          properties:
            id: { type: integer, example: 1 }
            codigo: { type: string, example: COB-001 }
            nombre: { type: string, example: Pedro Rojas }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        refreshToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        expiresIn: { type: string, description: 'TTL del access token', example: 15m }

    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/AuthTokens'

    Usuario:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombreCompleto: { type: string, example: Administrador General }
        usuario: { type: string, example: admin }
        email: { type: string, format: email, example: admin@empresa.com }
        rolId: { type: integer, example: 1 }
        activo: { type: boolean, example: true }
        intentosFallidos: { type: integer, example: 0 }
        bloqueadoHasta: { type: string, format: date-time, nullable: true, example: null }
        ultimoAcceso: { type: string, format: date-time, nullable: true, example: '2026-09-19T12:00:00.000Z' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rol:
          type: object
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Administrador }

    UsuarioPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Usuario' }

    Rol:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Administrador }
        descripcion: { type: string, nullable: true, example: Acceso total }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        permisos:
          type: array
          items: { type: string }
          example: [usuarios.ver, pagos.validar]
        usuarioCount: { type: integer, example: 1 }

    RolPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Rol' }

    Cobrador:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Pedro Rojas }
        codigo: { type: string, example: CBR-001 }
        usuarioId: { type: integer, nullable: true, example: 3 }
        activo: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        usuario:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 3 }
            usuario: { type: string, example: jperez }

    CobradorPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Cobrador' }

    Banco:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Banco de Venezuela }
        codigo: { type: string, example: BDV }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BancoResumen:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Banco de Venezuela }
        codigo: { type: string, example: BDV }

    BancoPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Banco' }

    Cuenta:
      type: object
      properties:
        id: { type: integer, example: 1 }
        bancoId: { type: integer, example: 1 }
        numeroCuenta: { type: string, example: '0102-0123-45-6789012345' }
        alias: { type: string, nullable: true, example: Cuenta principal }
        activo: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        banco:
          $ref: '#/components/schemas/BancoResumen'

    CuentaResumen:
      type: object
      properties:
        id: { type: integer, example: 1 }
        numeroCuenta: { type: string, example: '0102-0123-45-6789012345' }
        alias: { type: string, nullable: true, example: Cuenta principal }
        banco:
          $ref: '#/components/schemas/BancoResumen'

    CuentaPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Cuenta' }

    TipoPago:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Pago Movil }
        descripcion: { type: string, nullable: true, example: Pago movil interbancario }
        activo: { type: boolean, example: true }
        orden: { type: integer, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TipoPagoResumen:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Pago Movil }
        descripcion: { type: string, nullable: true, example: Pago movil interbancario }

    TipoPagoPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TipoPago' }

    CreateTipoPagoRequest:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 80, example: Pago Movil }
        descripcion: { type: string, maxLength: 255, nullable: true, example: Pago movil interbancario }
        activo: { type: boolean, default: true, example: true }
        orden: { type: integer, minimum: 0, default: 0, example: 1 }

    UpdateTipoPagoRequest:
      type: object
      properties:
        nombre: { type: string, maxLength: 80, example: Pago Movil }
        descripcion: { type: string, maxLength: 255, nullable: true, example: Pago movil interbancario }
        activo: { type: boolean, example: true }
        orden: { type: integer, minimum: 0, example: 2 }

    Tasa:
      type: object
      properties:
        id: { type: integer, example: 1 }
        fecha: { type: string, format: date-time, example: '2026-09-19T00:00:00.000Z' }
        valor:
          type: string
          description: Valor de la tasa como string (DECIMAL(18,6))
          example: '36.500000'
        fuente: { type: string, nullable: true, example: BCV }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TasaPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Tasa' }

    TasaBcv:
      type: object
      properties:
        id: { type: integer, example: 5 }
        apiId:
          type: string
          description: Identificador uuid de la API externa (clave de deduplicacion)
          example: 5f2c9b7a1d3e4f60718293a4b5c6d7e8
        fecha: { type: string, format: date-time, example: '2026-09-19T00:00:00.000Z' }
        usd:
          type: string
          description: Tasa en USD como string (DECIMAL(18,6))
          example: '36.500000'
        fuente: { type: string, nullable: true, example: BCV }
        fechaApi:
          type: string
          format: date-time
          description: Timestamp original devuelto por la API
          example: '2026-09-19T12:00:00.000Z'
        createdAt: { type: string, format: date-time }

    TasaBcvPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TasaBcv' }

    BcvJobEstado:
      type: object
      properties:
        habilitado: { type: boolean, example: true }
        intervaloMinutos: { type: integer, description: Intervalo fijo del job en minutos, example: 60 }

    BcvJobToggleRequest:
      type: object
      required: [habilitado]
      properties:
        habilitado: { type: boolean, example: false }

    Parametro:
      type: object
      properties:
        id: { type: integer, example: 1 }
        clave: { type: string, example: tolerancia_monto_bs }
        valor: { type: string, example: '0.01' }
        descripcion: { type: string, nullable: true, example: Tolerancia de monto en bolivares }
        updatedAt: { type: string, format: date-time }

    ParametroPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Parametro' }

    ReportarPagoRequest:
      type: object
      required: [fechaPago, referencia, cuentaRecaudadoraId, montoBs, montoUsd, tipoCobro]
      properties:
        fechaPago:
          type: string
          description: Fecha de pago (fecha de calendario)
          example: '2026-09-19'
        fechaDocumento:
          type: string
          description: >-
            Fecha del documento (opcional). Alimenta solo la clasificacion
            heredada que se calcula al reportar (`clasificarPorAntiguedad`,
            contra la fecha de pago y el umbral `cobro.umbral_antiguedad_dias`);
            NO determina el veredicto de antiguedad que leen los reportes: ese se
            deriva del movimiento bancario vinculado al validar.
          example: '2026-08-01'
        referencia: { type: string, maxLength: 60, example: '12345678' }
        bancoOrigenId:
          type: integer
          nullable: true
          description: >-
            Banco de origen opcional. Si el parametro pago.banco_origen_obligatorio
            esta activo ('1', valor por defecto) y no se envia, el API responde 400 con
            "El banco de origen es obligatorio.".
          example: 1
        cuentaRecaudadoraId: { type: integer, example: 1 }
        montoBs:
          type: string
          description: >-
            Monto en bolivares como string (DECIMAL(18,2)). Debe ser estrictamente
            positivo (400 "El monto debe ser un numero positivo" si es no numerico,
            cero o negativo).
          example: '3600.00'
        montoUsd:
          type: string
          description: >-
            Monto en dolares como string (DECIMAL(18,2)). Debe ser estrictamente
            positivo (400 "El monto debe ser un numero positivo" si es no numerico,
            cero o negativo).
          example: '20.00'
        cliente: { type: string, maxLength: 180, example: Juan Perez }
        concepto: { type: string, maxLength: 255, example: Pago cuota mensual }
        tipoCobro: { type: string, enum: [nuevo, viejo], example: nuevo }
        tipoPagoId:
          type: integer
          description: >-
            Referencia opcional al catalogo tipos_pago (debe existir y estar activo). Debe
            OMITIRSE cuando no aplica; enviar null responde 400.
          example: 1
        observaciones: { type: string, maxLength: 2000, example: Reportado en ruta }
        cobradorId:
          type: integer
          description: Solo permitido con permiso pagos.ver_todos
          example: 1

    Pago:
      type: object
      properties:
        id: { type: integer, example: 10 }
        fechaPago: { type: string, format: date-time, example: '2026-09-19T00:00:00.000Z' }
        referencia: { type: string, example: '12345678' }
        montoBs: { type: string, description: 'String (DECIMAL(18,2))', example: '3600.00' }
        montoUsd: { type: string, description: 'String (DECIMAL(18,2))', example: '20.00' }
        tasa: { type: string, description: 'String (DECIMAL(18,6)) derivada', example: '180.000000' }
        cliente: { type: string, nullable: true, example: Juan Perez }
        concepto: { type: string, nullable: true, example: Pago cuota mensual }
        tipoPagoId: { type: integer, nullable: true, example: 1 }
        soporteUrl: { type: string, nullable: true, example: /uploads/1699999999999-comprobante.pdf }
        tipoCobro: { type: string, enum: [nuevo, viejo], example: nuevo }
        tipoCobroDerivado: { type: string, enum: [nuevo, viejo], nullable: true, example: nuevo }
        fuenteDerivacion:
          type: string
          enum: [reporte, movimiento]
          nullable: true
          description: >-
            Origen del veredicto de antiguedad persistido. `movimiento` cuando se
            determino al validar contra el movimiento bancario vinculado
            (`tipoCobroDerivado`); `reporte` cuando proviene de la clasificacion
            al reportar con `fechaDocumento`; `null` sin veredicto (pago
            pendiente o validacion revertida).
          example: movimiento
        revisarClasificacion: { type: boolean, example: false }
        observaciones: { type: string, nullable: true, example: null }
        estado: { type: string, enum: [pendiente, validado, rechazado, duplicado], example: pendiente }
        motivoRechazo: { type: string, nullable: true, example: null }
        validadoAt: { type: string, format: date-time, nullable: true, example: null }
        createdAt: { type: string, format: date-time }
        cobradorId: { type: integer, example: 1 }
        bancoOrigenId: { type: integer, nullable: true, example: 1 }
        cuentaRecaudadoraId: { type: integer, example: 1 }
        movimientoBancoId: { type: integer, nullable: true, example: null }
        cobrador:
          type: object
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Pedro Rojas }
            codigo: { type: string, example: CBR-001 }
        tipoPago:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Pago Movil }
        bancoOrigen:
          type: object
          nullable: true
          description: >-
            Banco de origen del pago. Cuando el pago no tiene banco (regla
            pago.banco_origen_obligatorio desactivada y sin seleccion), el API nunca
            devuelve null: responde { id: null, nombre: "N/A", codigo: "N/A" } para que
            todo cliente muestre "N/A" sin casos especiales.
          properties:
            id: { type: integer, nullable: true, example: 1 }
            nombre: { type: string, example: Banco de Venezuela }
            codigo: { type: string, example: BDV }
        cuentaRecaudadora:
          type: object
          properties:
            id: { type: integer, example: 1 }
            numeroCuenta: { type: string, example: '0102-0123-45-6789012345' }
            alias: { type: string, nullable: true, example: Cuenta principal }
            banco:
              type: object
              properties:
                id: { type: integer, example: 1 }
                nombre: { type: string, example: Banco de Venezuela }
        movimientoBanco:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 25 }
            referencia: { type: string, example: '12345678' }
            montoBs: { type: string, example: '3600.00' }
            fechaEjecucion: { type: string, format: date-time, example: '2026-09-19T00:00:00.000Z' }
        antiguedadDias:
          type: integer
          nullable: true
          description: >-
            Brecha firmada en dias completos entre la `fechaPago` reportada y la
            `fechaEjecucion` del movimiento bancario vinculado (0 = mismo dia;
            positivo = movimiento anterior = pago viejo; negativo = movimiento
            posterior). Se persiste con el veredicto al validar y solo viaja
            cuando el veredicto proviene del movimiento
            (`fuenteDerivacion = movimiento`); en cualquier otro caso es `null`.
          example: 2
        validador:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 1 }
            nombreCompleto: { type: string, example: Administrador General }

    PagoPage:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Pago' }

    RevertirPagoRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pendiente, rechazado]
          description: Estado destino del pago al revertir la validacion
          example: rechazado
        motivoRechazo:
          type: string
          minLength: 3
          maxLength: 1000
          nullable: true
          description: Obligatorio cuando `estado` es `rechazado`; no debe enviarse cuando es `pendiente`.
          example: Validacion revertida por error de conciliacion

    Coincidencia:
      type: object
      properties:
        movimiento:
          type: object
          properties:
            id: { type: integer, example: 25 }
            referencia: { type: string, example: '12345678' }
            montoBs: { type: string, example: '3600.00' }
            fechaEjecucion: { type: string, format: date-time, example: '2026-09-19T00:00:00.000Z' }
        puntaje: { type: integer, description: 'Puntaje 0..100', example: 90 }
        referenciaExacta: { type: boolean, example: true }
        coincidenciaSufijo: { type: boolean, example: false }
        diferenciaMontoBs: { type: string, example: '0.00' }
        diferenciaDias: { type: integer, example: 0 }

    DuplicadoInfo:
      type: object
      description: >-
        Senal CR-001 de duplicado: un movimiento bancario ya conciliado con otro pago
