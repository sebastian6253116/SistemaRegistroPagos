                    categoria: Transporte
                    autorizadoPor: Gerencia
                    registradoPor: 1
                    soporteUrl: /uploads/1699999999999-factura.pdf
                    createdAt: '2026-09-15T00:00:00.000Z'
                    updatedAt: '2026-09-15T00:00:00.000Z'
