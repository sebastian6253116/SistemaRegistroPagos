  /uploads/{filename}:
    get:
      tags: [Archivos]
      operationId: descargarArchivo
      summary: Descargar archivo de soporte
      description: |
        Descarga autenticada y autorizada de un archivo almacenado en `UPLOAD_DIR`.
        El directorio `uploads/` ya NO se sirve de forma publica: este endpoint es
        la unica via de descarga. El nombre se resuelve contra el registro que lo
        referencia y la autorizacion es por archivo: para el comprobante de un pago
        se requiere el permiso `pagos.ver_todos`, el permiso `pagos.validar`, o ser
        el cobrador del pago; para el soporte de un gasto se requiere `gastos.ver`.
        En cualquier otro caso responde 403. Un archivo que ningun registro
        referencia (o que no existe) responde 404 sin revelar su existencia.

        El nombre se reduce con `path.basename()` y la ruta resuelta se verifica
        dentro del directorio de subidas: los intentos de traversal con separadores,
        `..` o bytes de control responden 400. La respuesta usa el `Content-Type`
        derivado de la lista blanca de extensiones y agrega
        `X-Content-Type-Options: nosniff`, `Content-Disposition: inline` y
        `Cache-Control: private, no-store`.
      parameters:
        - name: filename
          in: path
          required: true
          description: Nombre del archivo tal como se almaceno (`<timestamp>-<slug>.<ext>`)
          schema: { type: string, example: 1699999999999-comprobante.pdf }
      responses:
        '200':
          description: Contenido del archivo (imagen o PDF)
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

