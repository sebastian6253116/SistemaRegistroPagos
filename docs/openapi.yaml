              example:
                id: 5
                apiId: 5f2c9b7a1d3e4f60718293a4b5c6d7e8
                fecha: '2026-09-19T00:00:00.000Z'
                usd: '36.500000'
                fuente: BCV
                fechaApi: '2026-09-19T12:00:00.000Z'
                createdAt: '2026-09-19T12:00:05.000Z'
        '401':
