              schema:
                $ref: '#/components/schemas/TasaPage'
              example:
                data:
                  - id: 1
                    fecha: '2026-09-19T00:00:00.000Z'
                    valor: '36.500000'
                    fuente: BCV
                    createdAt: '2026-09-19T00:00:00.000Z'
                    updatedAt: '2026-09-19T00:00:00.000Z'
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
