                    accion: validar
                    datosAntes: { estado: pendiente }
                    datosDespues: { estado: validado }
                    ip: 127.0.0.1
                    createdAt: '2026-09-19T15:00:00.000Z'
                    usuario: { id: 1, usuario: admin, nombreCompleto: Administrador General }
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        '400':
