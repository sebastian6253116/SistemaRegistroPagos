        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasas-bcv/sincronizar:
    post:
      tags: [Tasa BCV]
      operationId: sincronizarTasaBcv
      summary: Sincronizar manualmente la tasa BCV
      description: |
        Requiere permiso: config.editar. Consulta la API externa una vez y guarda la tasa
        solo si es nueva (deduplicada por `apiId`). Nunca responde 5xx por un fallo externo:
        los errores de red o de parseo se devuelven en el cuerpo.
      responses:
        '200':
          description: Resultado de la sincronizacion
          content:
            application/json:
              schema:
                type: object
                properties:
                  insertada: { type: boolean, example: true }
                  motivo: { type: string, enum: [duplicado, error], nullable: true, example: duplicado }
                  tasa:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/TasaBcv'
                  error: { type: string, nullable: true, example: Error de red }
              example:
                insertada: true
                tasa:
                  id: 5
                  apiId: 5f2c9b7a1d3e4f60718293a4b5c6d7e8
                  fecha: '2026-09-19T00:00:00.000Z'
                  usd: '36.500000'
                  fuente: BCV
                  fechaApi: '2026-09-19T12:00:00.000Z'
                  createdAt: '2026-09-19T12:00:05.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /parametros:
