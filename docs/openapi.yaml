        minimo de 4 digitos) y monto en Bs dentro de `match.amount_tolerance_bs`,
        dentro de la MISMA cuenta recaudadora y SIN ventana de fecha.
      properties:
        movimientoBancoId: { type: integer, description: 'Movimiento ya conciliado', example: 25 }
        referencia: { type: string, description: 'Referencia del movimiento', example: '12345678' }
        montoBs: { type: string, description: 'String (DECIMAL(18,2))', example: '3600.00' }
        pagoReportadoId: { type: integer, description: 'Pago con el que ya esta conciliado', example: 10 }

    Movimiento:
      type: object
